# Netlify Configuration for SnackFlow Web (Static Export)

[build]
  command = "pnpm --filter @snackflow/shared build && pnpm --filter @snackflow/web build"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"

# SPA Fallback for client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
